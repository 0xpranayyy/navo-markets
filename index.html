<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Real markets on elections, sports, crypto, and culture — priced by the crowd, traded in seconds." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Navo" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Navo — Prediction Markets" />
    <meta property="og:description" content="Real markets on elections, sports, crypto, and culture — priced by the crowd, traded in seconds." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <script>
      (function () {
        function isStandalone() {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.navigator.standalone === true;
        }
        function applyStandaloneViewport() {
          if (!isStandalone()) return;
          var inner = window.innerHeight;
          document.documentElement.style.setProperty('--navo-app-h', inner + 'px');
        }
        try {
          var pref = localStorage.getItem('navo-theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.background = dark ? '#000000' : '#F4F5F7';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (m) {
            var media = m.getAttribute('media') || '';
            if (media.indexOf('dark') !== -1) m.setAttribute('content', '#000000');
            else if (media.indexOf('light') !== -1) m.setAttribute('content', '#F4F5F7');
          });
          if (isStandalone()) document.documentElement.classList.add('navo-standalone');
          var ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (ios) document.documentElement.classList.add('navo-ios');
          applyStandaloneViewport();
          window.addEventListener('resize', applyStandaloneViewport);
          window.addEventListener('orientationchange', function () {
            setTimeout(applyStandaloneViewport, 150);
          });
          window.visualViewport && window.visualViewport.addEventListener('resize', applyStandaloneViewport);
        } catch (e) {}
      })();
    </script>
    <title>Navo — Prediction Markets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
